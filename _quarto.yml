    pinned: true
    #logo: assets/img/turtle.webp
    
    # your sub-pages
    right:
      - text: CV
        aria-label: "CV"
        href: "cv/index.qmd"
      - text: Research
        aria-label: "Research"
        menu: 
          - href: "dissertation/index.qmd"
          - href: "pre_phd/index.qmd"
      - text: Publications
        aria-label: "Publications"
        href: "publications/index.qmd"
      - text: Teaching
        aria-label: "Teaching"
        href: "teaching/index.qmd"
